# A private agenda's entry in the Observatory. The hourly index cannot read a private repository, so this
# workflow builds the agenda's entry itself, with the Observatory's site/build.py, and keeps it in the
# branch `observatory`, where only those who can read this repository can read it. In a public repository
# it does nothing, since the index reads that directly.
name: observatory
on:
  issues:
  issue_comment:
  push:
    branches-ignore: [observatory]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: observatory
  cancel-in-progress: true
jobs:
  snapshot:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Only a private agenda needs a snapshot
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.visibility.outputs.private == 'true'
        with:
          repository: ${{ vars.OBSERVATORY_REPO || 'Public-Observatory/Public-Observatory.github.io' }}
          path: .observatory
      - uses: actions/setup-python@v5
        if: steps.visibility.outputs.private == 'true'
        with:
          python-version: "3.12"
      - name: Build the entry
        if: steps.visibility.outputs.private == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .observatory/site/build.py snapshot snapshot "$GITHUB_REPOSITORY"
      - name: Keep it, as one commit, in the branch observatory
        if: steps.visibility.outputs.private == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: snapshot
        run: |
          git init -q -b observatory
          git add entry.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "The agenda's entry in the Observatory"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" observatory
